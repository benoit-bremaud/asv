sonar.projectKey=asv
sonar.host.url=http://localhost:9000
sonar.sources=src
sonar.tests=src,test
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/*.test.ts,**/*.test.tsx,src/transports/cloudflare/test-*.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Wait for the quality gate; pnpm sonar still runs scripts/sonar-status.sh when it fails (ADR-0016).
sonar.qualitygate.wait=true
